[window]
dimensions = { columns = 140, lines = 30 }

[window.padding]
y = 6
x = 6

[font]
size = 14

[font.normal]
family = "Maple Mono Normal NF"
style = "Regular"

[font.bold]
family = "Maple Mono Normal NF"
style = "Bold"

[font.italic]
family = "Maple Mono Normal NF"
style = "Italic"

[font.bold_italic]
family = "Maple Mono Normal NF"
style = "Bold Italic"

[font.offset]
x = 0
y = 0

[cursor]
blink_interval = 750
[cursor.style]
shape = "Block"
blinking = "Always"

[cursor.vi_mode_style]
shape = "Block"
blinking = "Always"


[general]
import = ["~/.config/alacritty/catppuccin_mocha.toml"]
