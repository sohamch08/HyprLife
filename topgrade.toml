[misc]
# Authenticate upfront and refresh sudo credentials every minute.
pre_sudo = true
sudo_loop = true
sudo_loop_interval = 60

# Use the custom Zsh updater below instead of the built-in shell updates.
disable = ["firmware", "hyprpm", "shell"]
last = ["flatpak"]
ignore_failures = ["pip3"]
assume_yes = true

# Continue past failures without prompting to retry.
ask_retry = false
cleanup = true
notify_end = "on_failure"

[commands]
# Load the Zsh configuration to make zplugin-update available.
"Zsh plugins" = "ZDOTDIR=\"$HOME/.config/zsh\" zsh -ic 'zplugin-update; exit $?'"
# Requires Obsidian to be running; update community plugins in the Research vault.
"Obsidian plugins" = "bash \"$HOME/projects/HyprLife/maintenance/update-obsidian-plugins.sh\" Research"

[python]
# Requires pip-review to be installed.
enable_pip_review = true

[linux]
# Refresh package metadata before DNF updates.
dnf_arguments = "--refresh"

[git]
max_concurrency = 5
# Rebase local commits and temporarily stash uncommitted changes when pulling.
arguments = "--rebase --autostash"
repos = [
    "~/projects/HyprLife",
    "~/projects/sohamch08.github.io",
    "~/projects/Research",
    "~/projects/My-bibs",
    "~/projects/CV",
    "~/projects/dotfiles",
    "~/.config/nvim",
    "~/.config/cmus",
    "~/.config/tmux",
    "~/.config/neomutt",
    "~/.config/zsh",
]

[flatpak]
# Update the system-wide Flatpak installation.
use_sudo = true

[cargo]
# Include Cargo packages installed from Git.
git = true
