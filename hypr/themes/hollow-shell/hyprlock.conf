# Hollow Shell lock screen for Hyprlock 0.9.6
# Installed as the default Hyprlock theme; no session was locked during installation.
# Original art: Team Cherry, via sergoncano/hollow-knight-grub-theme.
# Tuned for 1920x1080, scale 1. Positive y offsets point upward.
$assets = /home/soham/.config/hypr/themes/hollow-shell/assets
$display_font = Trajanus Roman
$body_font = Perpetua Std

general {
    hide_cursor = true
    ignore_empty_input = true
}

animations {
    enabled = true
    bezier = soft, 0.16, 1, 0.3, 1
    animation = fadeIn, 1, 5, soft
    animation = fadeOut, 1, 3, soft
}

background {
    monitor =
    path = $assets/background.png
    color = rgb(08101e)
    blur_passes = 0
    noise = 0.0
    contrast = 1.0
    brightness = 1.0
    vibrancy = 0.0
}

image {
    monitor =
    path = $assets/hollow-shell-logo.png
    size = 440
    rounding = 0
    border_size = 0
    position = 0, 215
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(eeeef4ff)
    font_size = 84
    font_family = $display_font
    position = 0, -110
    halign = center
    valign = center
    text_align = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = rgba(eeeef4ff)
    font_size = 24
    font_family = $body_font
    position = 0, -195
    halign = center
    valign = center
    text_align = center
}

label {
    monitor =
    text = <b>$USER</b>
    color = rgba(eeeef4ff)
    font_size = 22
    font_family = $body_font
    position = 0, -240
    halign = center
    valign = center
    text_align = center
}

image {
    monitor =
    path = $assets/steel-soul-password-frame.png
    size = 154
    rounding = 0
    border_size = 0
    position = 21.4375, -360.875
    halign = center
    valign = center
    zindex = 0
}

input-field {
    monitor =
    size = 180, 40
    position = 28, -367
    halign = center
    valign = center
    rounding = 20
    outline_thickness = 1
    outer_color = rgba(00000000)
    inner_color = rgba(00000000)
    font_color = rgb(eeeef4)
    font_family = $body_font
    placeholder_text = 
    check_text = Unlocking…
    fail_text = <span foreground="##efaaa8">Try again</span>
    check_color = rgba(d6e5ff66)
    fail_color = rgba(d88989aa)
    capslock_color = rgba(e4c58cff)
    dots_size = 0.18
    dots_spacing = 0.4
    dots_center = true
    fade_on_empty = true
    zindex = 1
    fade_timeout = 0
}
