general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
listener {
    timeout = 120
    on-timeout = alacritty --class neo-screensaver -o 'window.startup_mode="Fullscreen"' -o 'window.padding={x=0,y=0}' -e zsh -c 'source "$HOME/.config/zsh/aliases.zsh"; eval "neowake -s"'
    on-resume = pkill -f '^alacritty --class neo-screensaver'
}

listener {
    timeout = 150                            # in seconds.
    on-timeout = brightnessctl -s set 10
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })' && brightnessctl -r
}

listener {
    timeout = 1000
    on-timeout = systemctl suspend
}
